# 위험 Pod 3: root(UID 0) 로 실행 — 서버측 dry-run 으로만 시도
apiVersion: v1
kind: Pod
metadata: { name: hannctl-attack-root, labels: { hannctl.io/scenario: s2 } }
spec:
  containers:
    - name: c
      image: public.ecr.aws/docker/library/busybox:1.37
      command: [sleep, "3600"]
      securityContext: { runAsUser: 0 }

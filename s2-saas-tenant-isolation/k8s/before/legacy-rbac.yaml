# [BEFORE] "편하게" 준 과다 권한: 두 테넌트 운영자 그룹 모두에게 클러스터 전체 edit 권한
#  → A 운영자가 B 고객사의 Pod·Secret 까지 조회/변경 가능 (위험 재현용)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hannctl-legacy-tenant-operators-edit
  labels: { hannctl.io/scenario: s2, hannctl.io/phase: before }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit }
subjects:
  - { kind: Group, name: "hannctl:tenant-a-operators", apiGroup: rbac.authorization.k8s.io }
  - { kind: Group, name: "hannctl:tenant-b-operators", apiGroup: rbac.authorization.k8s.io }

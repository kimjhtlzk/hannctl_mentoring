# [AFTER 4] audit-app 네트워크 최소화: 전부 차단 후 필요한 경로만 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-all, namespace: audit-app, labels: { hannctl.io/scenario: s4 } }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
# 모든 Pod → CoreDNS(53) 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns-egress, namespace: audit-app, labels: { hannctl.io/scenario: s4 } }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
# web → api(8080) 만 허용 (나가는 쪽)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-web-to-api-egress, namespace: audit-app, labels: { hannctl.io/scenario: s4 } }
spec:
  podSelector: { matchLabels: { app: web } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: api } } }]
      ports: [{ protocol: TCP, port: 8080 }]
---
# api ← web(8080) 만 허용 (들어오는 쪽) — other-team 등 다른 Namespace 는 차단
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-api-from-web-ingress, namespace: audit-app, labels: { hannctl.io/scenario: s4 } }
spec:
  podSelector: { matchLabels: { app: api } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: web } } }]
      ports: [{ protocol: TCP, port: 8080 }]

# [AFTER 4] 앱 전용 ServiceAccount — default SA 를 쓰지 않는다 (CIS 4.1.5)
#  API 를 호출하지 않는 앱이므로 토큰도 마운트하지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata: { name: web, namespace: audit-app, labels: { hannctl.io/scenario: s4 } }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: api, namespace: audit-app, labels: { hannctl.io/scenario: s4 } }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: client, namespace: other-team, labels: { hannctl.io/scenario: s4 } }
automountServiceAccountToken: false

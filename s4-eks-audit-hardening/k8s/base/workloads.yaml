# AuditReady 업무 서비스(점검 대상)
#  audit-app : web → api (실제 운영 서비스)
#  other-team: client (다른 팀 워크로드 — 네트워크 격리 점검용)
apiVersion: v1
kind: Namespace
metadata:
  name: audit-app
  labels: { hannctl.io/scenario: s4 }
---
apiVersion: v1
kind: Namespace
metadata:
  name: other-team
  labels: { hannctl.io/scenario: s4 }
---
# 점검용 가상 비밀값 — 개발자·앱이 볼 필요 없는 정보
apiVersion: v1
kind: Secret
metadata: { name: payment-api-key, namespace: audit-app, labels: { hannctl.io/scenario: s4 } }
stringData: { key: "demo-only-not-a-real-secret" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: audit-app
  labels: { app: web, hannctl.io/scenario: s4 }
spec:
  replicas: 1
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      terminationGracePeriodSeconds: 5   # 샘플 서버는 종료 신호를 따로 처리하지 않음 → 빨리 교체되도록
      # 보안 기준(restricted)을 처음부터 만족 → After 에서 정책을 켜도 그대로 실행된다
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: public.ecr.aws/docker/library/python:3.13-alpine
          command: [python3, /app/app.py]
          env: [{ name: TENANT, value: audit-app }, { name: ROLE, value: web }, { name: PYTHONDONTWRITEBYTECODE, value: "1" }]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { memory: 64Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: auditready-app } }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: audit-app, labels: { hannctl.io/scenario: s4 } }
spec: { selector: { app: web }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: audit-app
  labels: { app: api, hannctl.io/scenario: s4 }
spec:

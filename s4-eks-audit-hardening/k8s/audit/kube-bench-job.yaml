# kube-bench 1회 점검 (CIS Amazon EKS Benchmark v1.8.0)
#  - node: 노드(kubelet) 설정   - policies: RBAC·Pod 보안·네트워크 정책
#  - controlplane/managedservices: AWS 관리형 영역 → 대부분 수동(WARN) 항목
#  결과는 JSON 으로 로그에 출력 → run.sh 가 수집 후 Job 삭제
apiVersion: batch/v1
kind: Job
metadata:
  name: hannctl-kube-bench
  namespace: hannctl-audit
  labels: { hannctl.io/scenario: s4 }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata: { labels: { app: kube-bench } }
    spec:
      serviceAccountName: kube-bench
      hostPID: true                     # 노드의 kubelet 프로세스 인자 확인용
      restartPolicy: Never
      containers:
        - name: kube-bench
          image: docker.io/aquasec/kube-bench:v0.16.0
          command: [kube-bench, run, --targets, "node,policies,managedservices,controlplane", --benchmark, eks-1.8.0, --json]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
          volumeMounts:                 # 노드 설정 파일은 읽기 전용으로만
            - { name: var-lib-kubelet, mountPath: /var/lib/kubelet, readOnly: true }
            - { name: etc-systemd, mountPath: /etc/systemd, readOnly: true }
            - { name: etc-kubernetes, mountPath: /etc/kubernetes, readOnly: true }
      volumes:
        - { name: var-lib-kubelet, hostPath: { path: /var/lib/kubelet } }
        - { name: etc-systemd, hostPath: { path: /etc/systemd } }
        - { name: etc-kubernetes, hostPath: { path: /etc/kubernetes } }

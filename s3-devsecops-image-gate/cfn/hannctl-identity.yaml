# =============================================================================
# hannctl Identity — 이 키트가 AWS 에서 일할 때 쓰는 "작업용 신원"
#  run.sh 가 처음 실행될 때 멘티의 로그인 자격 증명으로 자동 배포한다 (스택 이름: hannctl-identity)
#
#  (1) IAM Role hannctl-operator-role
#      - run.sh 의 모든 AWS 작업은 이 역할의 "임시 자격 증명"으로 실행된다 (Access Key 를 만들지 않음)
#      - 권한: PowerUserAccess(IAM 제외 전부) + IAM 은 이름이 hannctl- 로 시작하는 것만
#      - 자기 자신(역할·콘솔 사용자)은 고칠 수 없다 → 권한을 스스로 키우지 못함
#  (2) IAM User hannctl-admin (선택, root 로 로그인한 경우에만 생성)
#      - root 는 역할을 쓸 수 없으므로 콘솔 로그인 전용 사용자를 만든다 (Access Key 없음)
#      - 할 수 있는 일: 콘솔/CLI 로그인 + hannctl-operator-role 로 전환 + 첫 로그인 때 비밀번호 변경
#  비용: IAM 은 무료 (0원). 자동 정리(janitor) 대상이 아니다.
# =============================================================================
AWSTemplateFormatVersion: "2010-09-09"
Description: hannctl identity - operator role used by run.sh (and an optional console user when bootstrapped from root)

Parameters:
  CreateConsoleUser:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Create console sign-in user hannctl-admin (only when bootstrapped by the root user)
  ConsoleUserPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Initial password for hannctl-admin (must be changed at first sign-in)

Conditions:
  WithConsoleUser: !Equals [!Ref CreateConsoleUser, "true"]

Resources:
  # ---------------------------------------------------------------- (1) 작업용 역할
  OperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: hannctl-operator-role
      Description: hannctl kit operator role (temporary credentials only)
      MaxSessionDuration: 43200            # 최대 12시간 (CLI 가 만료 전에 자동 갱신)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # 이 계정 안에서 sts:AssumeRole 권한이 있는 신원(관리자, hannctl-admin)만 전환 가능
          - Effect: Allow
            Principal: { AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root" }
            Action: [sts:AssumeRole, sts:TagSession]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess   # IAM·Organizations·Account 를 뺀 나머지 전부
      Policies:
        - PolicyName: hannctl-operator-iam
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # IAM 은 hannctl- 이름만 만들고·고치고·지울 수 있다
              - Sid: HannctlIamOnly
                Effect: Allow
                Action: iam:*
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/hannctl-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:user/hannctl-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:policy/hannctl-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:instance-profile/hannctl-*"
              # 조회는 전체 허용 (점검·doctor 용)
              - Sid: IamReadOnly
                Effect: Allow
                Action: [iam:Get*, iam:List*]
                Resource: "*"
              # 자기 자신과 콘솔 사용자는 수정 금지 → 스스로 권한을 키우는 것을 막는다
              - Sid: NoSelfEscalation
                Effect: Deny
                NotAction: [iam:Get*, iam:List*, iam:PassRole]
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/hannctl-operator-role"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:user/hannctl-admin"
      Tags:
        - { Key: Project, Value: hannctl }
        - { Key: Name, Value: hannctl-operator-role }

  # ---------------------------------------------------------------- (2) root 대신 쓸 콘솔 사용자 (선택)
  ConsoleUser:
    Type: AWS::IAM::User
    Condition: WithConsoleUser
    Properties:
      UserName: hannctl-admin
      LoginProfile:
        Password: !Ref ConsoleUserPassword
        PasswordResetRequired: true        # 첫 로그인 때 새 비밀번호로 변경
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SignInLocalDevelopmentAccess   # aws login (콘솔 로그인 → CLI 임시 자격 증명)
        - arn:aws:iam::aws:policy/IAMUserChangePassword          # 내 비밀번호 변경
        - arn:aws:iam::aws:policy/AWSCloudShellFullAccess        # 콘솔에서 CloudShell 사용
      Policies:
        - PolicyName: hannctl-admin-switch-role
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # 할 수 있는 일은 작업용 역할로 전환하는 것뿐 (실제 작업 권한은 역할에 있다)
              - Effect: Allow
                Action: [sts:AssumeRole, sts:TagSession]
                Resource: !GetAtt OperatorRole.Arn
      Tags:
        - { Key: Project, Value: hannctl }
        - { Key: Name, Value: hannctl-admin }

Outputs:
  OperatorRoleArn:
    Value: !GetAtt OperatorRole.Arn
  ConsoleUser:
    Condition: WithConsoleUser
    Value: !Ref ConsoleUser

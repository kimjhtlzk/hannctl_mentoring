# [AFTER 4] HPA: CPU 사용률(요청량 대비) 50% 를 넘으면 Pod 를 2 → 최대 8개까지 자동 확장
#  - 확장은 빠르게(15초마다 최대 2배), 축소는 60초 동안 안정된 뒤에 (데모용으로 짧게 설정)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: shop-api, namespace: shop, labels: { hannctl.io/scenario: s1 } }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: shop-api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 50 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{ type: Percent, value: 100, periodSeconds: 15 }]
    scaleDown:
      stabilizationWindowSeconds: 60

# 위험 Pod 1: privileged 컨테이너 (노드 장악 가능) — 서버측 dry-run 으로만 시도(실제 생성 안 함)
apiVersion: v1
kind: Pod
metadata: { name: hannctl-attack-privileged, labels: { hannctl.io/scenario: s5 } }
spec:
  containers:
    - name: c
      image: public.ecr.aws/docker/library/busybox:1.37
      command: [sleep, "3600"]
      securityContext: { privileged: true }

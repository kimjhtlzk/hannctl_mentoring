# OfficeLink 사내 업무 환경 (Before/After 공통)
#  office-web : 사내 포털(정상 클라이언트) → office-api 호출
#  ServiceAccount app-reader / no-access : CloudFormation 의 Pod Identity Association 과 이름이 같아야 한다
apiVersion: v1
kind: Namespace
metadata:
  name: office
  labels: { hannctl.io/scenario: s5 }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: app-reader, namespace: office, labels: { hannctl.io/scenario: s5 } }   # → IAM Role ...-app-reader
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: no-access, namespace: office, labels: { hannctl.io/scenario: s5 } }    # → IAM Role ...-no-secret
---
apiVersion: v1
kind: Service
metadata: { name: office-api, namespace: office, labels: { hannctl.io/scenario: s5 } }
spec: { selector: { app: office-api }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: office-web
  namespace: office
  labels: { app: office-web, hannctl.io/scenario: s5 }
spec:
  replicas: 1
  selector: { matchLabels: { app: office-web } }
  template:
    metadata: { labels: { app: office-web, access: office-api } }
    spec:
      automountServiceAccountToken: false      # K8s API 토큰은 불필요 (Pod Identity 토큰은 EKS 가 별도 주입)
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: public.ecr.aws/lambda/python:3.13   # boto3 포함 공개 이미지
          command: [python3, /app/app.py]              # Lambda 런타임 대신 우리 앱 실행
          env:
            - { name: ROLE, value: web }
            - { name: HOME, value: /tmp }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          envFrom:
            - configMapRef: { name: officelink-config }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 5 }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { memory: 192Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: app, mountPath: /app }, { name: tmp, mountPath: /tmp }]
      volumes:
        - { name: app, configMap: { name: officelink-app } }
        - { name: tmp, emptyDir: {} }
